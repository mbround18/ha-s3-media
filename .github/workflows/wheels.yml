name: Wheels

# Home Assistant installs the integration's `requirements` with pip at setup
# time, and there is no Rust toolchain on Home Assistant OS. So the extension
# must exist as a prebuilt wheel for every architecture Home Assistant runs on:
# musllinux for HA OS / Container (Alpine), manylinux for Core in a venv.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      # One architecture failing should not cancel the other five; a partial
      # matrix tells you which targets are broken in a single run.
      fail-fast: false
      matrix:
        platform: [manylinux, musllinux]
        target: [x86_64, aarch64, armv7]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.platform == 'musllinux' && 'musllinux_1_2' || 'auto' }}
          args: --release --out dist --interpreter 3.12 3.13
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.target }}
          path: rust/dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: rust/dist/*.tar.gz

  publish:
    needs: [build, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
