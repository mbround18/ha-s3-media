[package]
name = "ha-s3-media-core"
version = "0.0.4"
edition = "2021"
description = "Rust/PyO3 S3 access layer for the Home Assistant S3 Media integration"
license = "MIT"
repository = "https://github.com/mbround18/ha-s3-media"

[lib]
name = "ha_s3_media_core"
crate-type = ["cdylib"]

[dependencies]
# TLS is pinned to rustls + ring rather than the SDK's default aws-lc backend.
# aws-lc-sys is C, and it does not cross-compile in the manylinux/musllinux
# containers used to build aarch64 and armv7 wheels -- which is exactly what
# Home Assistant runs on a Raspberry Pi. ring builds everywhere.
aws-config = { version = "1.1.7", default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
  "credentials-process",
  "sso",
] }
aws-sdk-s3 = { version = "1.141.0", default-features = false, features = [
  "http-1x",
  "rt-tokio",
] }
aws-smithy-http-client = { version = "1.4", features = ["rustls-ring"] }
tokio = { version = "1", features = ["full"] }
# abi3-py312 builds a single wheel per platform that works on CPython 3.12 and
# every later version. Without it, wheels are tied to exact interpreter
# versions -- and Home Assistant has already moved to 3.14, so cp312/cp313
# wheels would be skipped in favour of an sdist build that needs a Rust
# toolchain HA does not have.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
