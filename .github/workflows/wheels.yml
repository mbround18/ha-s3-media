name: Wheels

# Home Assistant installs the integration's `requirements` with pip at setup
# time, and there is no Rust toolchain on Home Assistant OS. So the extension
# must exist as a prebuilt wheel for every architecture Home Assistant runs on:
# musllinux for HA OS / Container (Alpine), manylinux for Core in a venv.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      # One architecture failing should not cancel the other five; a partial
      # matrix tells you which targets are broken in a single run.
      fail-fast: false
      matrix:
        platform: [manylinux, musllinux]
        target: [x86_64, aarch64, armv7]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          target: ${{ matrix.target }}
          # manylinux2014's aarch64 cross-compiler is GCC 4.8.5, which does not
          # define __ARM_ARCH -- ring's assembly refuses to build against it.
          # 2_28 ships GCC 7.5 and does. The other targets stay on 2014 so their
          # wheels keep the widest glibc compatibility.
          manylinux: >-
            ${{ matrix.platform == 'musllinux' && 'musllinux_1_2'
             || (matrix.target == 'aarch64' && '2_28' || 'auto') }}
          # No --interpreter: the abi3-py312 feature produces one wheel per
          # platform that covers 3.12 and every later version. Pinning
          # interpreters is what shipped 0.0.1 as cp312/cp313 wheels that
          # Home Assistant -- now on Python 3.14 -- could not use.
          args: --release --out dist
      # A non-abi3 wheel is installable only by the exact interpreter it was
      # built for, which is the 0.0.1 bug. Fail the build rather than publish one.
      - name: Verify the wheel is abi3
        run: |
          for w in rust/dist/*.whl; do
            echo "$w"
            case "$w" in *-abi3-*) ;; *) echo "::error::$w is not an abi3 wheel"; exit 1 ;; esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.target }}
          path: rust/dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: rust/dist/*.tar.gz

  publish:
    needs: [build, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The integration can release without the Rust core changing, in which
      # case its version is already on PyPI. Skip it rather than failing.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
